async function callClaude(prompt, systemMsg) {
  const res = await fetch("/api/analysis", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ prompt, systemMsg }),
  });
  if (!res.ok) {
    let m=`HTTP ${res.status}`;
    try{const d=await res.json();if(d.error?.message)m+=`: ${d.error.message}`;}catch(e){}
    throw new Error(m);
  }
  const data = await res.json();
  if (data.error) throw new Error(data.error.message||"API 오류");
  const txt = (data.content||[]).map(i=>i.text||"").join("").trim();
  const stripped = txt.replace(/```json\s*/gi,"").replace(/```\s*/g,"").trim();
  const m = stripped.match(/\{[\s\S]*\}/);
  if (!m) throw new Error("JSON을 찾을 수 없음: "+txt.substring(0,80));
  try { return JSON.parse(m[0]); } catch(e) { throw new Error("JSON 파싱 실패: "+e.message); }
}

⛔ 절대 금지:

- "이미 아는 사람만" 같은 희소성과 무관한 문장
- 배경지식에 없는 구체적 날짜/숫자 창작

aiRewrite: "지금 바로 해야 하는 이유" 딱 한 문장. 긴급성/희소성 기반.`;
    } else {

인식 전복형 문장으로 USP/차별점 전달.

구체적 수치/사실 기반으로 작성.`;

    if (item.id === 16) {

이 항목은 회사/브랜드 전체의 신뢰도를 증명하는 수치만 허용.

✅ 허용 (회사 레벨):

- 총 고객사/협력사 수
- 매출/성장 수치 (배경지식에 있을 때만)

⛔ 절대 금지:

- 배경지식에 없는 수치 창작

배경지식에 회사 레벨 수치가 없으면: 어떤 데이터를 추가하면 좋을지 형태만 제안.
예) "배경지식에 전체 누적 시공 건수나 업력 추가 시 강력한 신뢰 문장 가능"`;
    } else {
      catInstruction = `[신뢰 근거 카테고리]
이 항목: ${item.label}
고객 후기, 전후 비교, 실제 사용 사례 기반 신뢰 문장.
배경지식에서 실제 수치/사례 찾아서 활용.
숫자는 반드시 그대로 유지. 표현 방식만 다양하게:

사회적 증거 + 실제 사례 기반.`;

  } else if (catName?.includes("CTA") || catName?.includes("행동")) {

퍼널 마무리 행동 유도 문장.
질문형 CTA 우선: "이거 자료로 받아보고 싶은 분?" / "댓글에 '확인' 치면 드릴게요."
또는 DM/링크/신청 방식.
긴급성 장치: "지금 아니면 기회 없음" 뉘앙스 (협박 아닌 희소성으로).`;

  } else if (catName?.includes("브랜드")) {
    catInstruction = `[브랜드 카테고리]
이 항목: ${item.label}
감성/공감 요소 + 기억에 남는 한 문장.
인식 전복보다는 감정적 연결: "이건 ○○ 얘기가 아닙니다. 결국 ○○의 문제예요."`;

  } else if (catName?.includes("정보") || catName?.includes("마무리")) {
    catInstruction = `[정보/마무리 카테고리]
이 항목: ${item.label}
심리적 멈춤 장치로 핵심 정리: "여기서 중요한 게 뭐냐면요."
확신형 문장으로 마무리: "이미 아는 사람은 다르게 움직이고 있어요."`;

[제품명 규칙] 현재 대본 제품명만 사용. 다른 제품명 금지.

심리 기법 중 하나 선택 적용:

JSON만 반환: {"aiRewrite":"한문장","psychTech":"기법명"}`;

  return callClaude(prompt, PSYCH_SYSTEM);

// ✅ 카피 항목 재생성 - 심리 마케팅 기반
async function regenCopyItem(text, type, pdLabel, bgKnowledge) {
  const bgNote = bgKnowledge ? `\n배경지식:\n${bgKnowledge.substring(0,500)}` : "";
  const prompt = `기존 카피: ${text}
목적: ${pdLabel}${bgNote}
타입: ${type === 'caption' ? '영상 자막 카피 (슬로건/키워드 형태, 10~15자)' : '대본 후킹 카피 (한 줄, 20자 이내)'}

아래 중 하나의 방식으로 2개 작성:
- 검문형: "이거 아직도 ○○하면 늦었습니다"
- 인식전복형: "○○라고 착각하는 분들께"
- 손실회피형: "이거 모르면 ○○ 버립니다"
- 인정욕구형: "보는 사람이 딱 아는 ○○"

짧고 강렬하게. 문장 형태 금지. AI 티 금지.
JSON만 반환: {"alts":["카피1","카피2"]}`;
  return callClaude(prompt, PSYCH_SYSTEM);
}

// ✅ 신규 대본 전체 제안 - 심리 마케팅 구조 적용
async function generateNewScript(script, pdLabel, bgKnowledge, issues, sug) {
  const bgNote = bgKnowledge ? `\n\n[배경지식 — 반드시 활용, 여기 없는 수치/사실 절대 창작 금지]\n${bgKnowledge.substring(0,1500)}` : "";
  const prompt = `목적: ${pdLabel}
기존 대본: ${script}${bgNote}
분석된 문제점: ${(issues||[]).join(", ")||"없음"}
개선 방향: ${sug||"없음"}

⛔ 절대 금지: 배경지식에 없는 할인율/기간/프로모션/수치 창작 금지.
모든 구체적 사실은 배경지식 또는 기존 대본에서만 가져올 것.

아래 두 프레임워크를 결합해서 대본 작성:

[프레임워크 1 - 이상한마케팅/역행자 화법]
① 도입 (0~3초): 검문형/도발형으로 시작
   "이거 아직도 이렇게 생각하면, 솔직히 늦었습니다." 류
   심리적 락인 1회: "이건 끝까지 봐야 합니다."

② 중반 - 인식 전복:
   "사람들은 ○○라고 착각해요. 근데 그게 아닙니다."
   심리적 멈춤 2회: "여기서 중요한 게 뭐냐면요." / "대부분 이 지점에서 망합니다."

③ 결론 - 확신:
   "이건 ○○ 얘기가 아닙니다. 결국 선택의 문제예요."
   확신형: "이미 아는 사람은 다르게 움직이고 있어요."

[프레임워크 2 - 퍼널형 감정 트리거]
WIDE HOOK → 공통기준 → 좁히기(제품 연결) → CTA
감정 트리거: 손실회피/후회/비교열등감/인정욕구 중 2개
행동 유도: 질문형 CTA 1개 (자연스럽게)

조건:
- 분량: 60초 이내, 구어체, 200~300자
- 배경지식 실제 수치/사례 반드시 활용
- AI 티 금지. 현장감 있는 말투.
- keyChanges: 기존 대본 대비 바뀐 점 3가지 (각 20자 이내)

JSON만 반환: {"script":"완성된신규대본전체","keyChanges":["변경점1","변경점2","변경점3"]}`;
  return callClaude(prompt, PSYCH_SYSTEM);
}

function StepBar({ labels, current }) {
  return (
    <div style={{display:"flex",alignItems:"center",marginBottom:"1.5rem"}}>
      {labels.map((l,i) => (
        <div key={i} style={{display:"flex",alignItems:"center",flex:i<labels.length-1?1:"none"}}>
          <div style={{display:"flex",alignItems:"center",gap:5,fontSize:12,whiteSpace:"nowrap",color:i<current?"#3B6D11":i===current?"#111":"#bbb",fontWeight:i===current?500:400}}>
            <div style={{width:20,height:20,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,flexShrink:0,border:i<current?"1.5px solid #3B6D11":i===current?"1.5px solid #111":"1.5px solid #ddd",background:i<current?"#EAF3DE":i===current?"#111":"transparent",color:i<current?"#3B6D11":i===current?"#fff":"#bbb"}}>
              {i<current?"✓":i+1}
            </div>
            <span>{l}</span>
          </div>
          {i<labels.length-1 && <div style={{flex:1,height:1,background:"#eee",margin:"0 6px",minWidth:6}}/>}

  );
}

function CopyBtn({ text }) {
  const [done,setDone] = useState(false);
  if (!text) return null;
  return (
    <div onClick={()=>{try{navigator.clipboard.writeText(text);}catch(e){}setDone(true);setTimeout(()=>setDone(false),1500);}}
      style={{padding:"7px 12px",background:done?"#EAF3DE":"#f5f5f5",border:`0.5px solid ${done?"#3B6D11":"#e0e0e0"}`,borderRadius:8,fontSize:12,lineHeight:1.6,display:"flex",gap:8,cursor:"pointer"}}>
      <span style={{fontSize:11,fontWeight:500,padding:"1px 6px",borderRadius:4,background:"#e0e0e0",color:"#666",flexShrink:0}}>→</span>
      <span style={{color:done?"#3B6D11":"#111"}}>{done?"복사됨!":text}</span>
    </div>
  );
}

function RewritePanel({ item, pdLabel, catName, bgKnowledge, defaultTab, onAccept, onClose, onUpdateRewrite }) {
  // 플레이스홀더 감지: "N년", "OO", "[숫자]" 등이 있으면 직접수정 탭으로
  function hasPlaceholder(text) {
    if (!text) return false;
    return /\bN년|\bN개|\bOO|\[숫자\]|\[N\]|○○/.test(text);
  }
  const autoTab = hasPlaceholder(item.aiRewrite) ? "manual" : (defaultTab || "ai");
  const [edited,setEdited]=useState(item.aiRewrite||"");
  const [tab,setTab]=useState(autoTab);
  const [regenLoading,setRegenLoading]=useState(false);
  const [curRewrite,setCurRewrite]=useState(item.aiRewrite||"");
  const [curTech,setCurTech]=useState(item.psychTech||"");

  async function handleRegen() {
    setRegenLoading(true);
    try {
      const r = await regenScriptItem(item, pdLabel, catName, bgKnowledge);
      setCurRewrite(r.aiRewrite||curRewrite); setCurTech(r.psychTech||curTech);
      onUpdateRewrite(item.id, r.aiRewrite, r.psychTech);
    } catch(e) {} finally { setRegenLoading(false); }
  }
  return (
    <div style={{marginTop:8,border:"0.5px solid #185FA5",borderRadius:10,overflow:"hidden"}}>
      <div style={{padding:"8px 12px",background:"#E6F1FB",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:12,fontWeight:500,color:"#185FA5"}}>수정 제안</span>
        <div style={{display:"flex",gap:4}}>
          {["ai","manual"].map(t=>(
            <button key={t} onClick={()=>setTab(t)} style={{fontSize:11,padding:"3px 9px",borderRadius:5,cursor:"pointer",border:"none",background:tab===t?"#185FA5":"transparent",color:tab===t?"#fff":"#185FA5"}}>
              {t==="ai"?"AI 제안":"직접 수정"}
            </button>
          ))}
        </div>
      </div>
      <div style={{padding:"10px 12px"}}>
        {item.orig && !item.orig.startsWith("(") && (
          <div style={{marginBottom:10}}>
            <div style={{fontSize:11,color:"#888",marginBottom:4}}>현재 대본</div>
            <div style={{padding:"8px 10px",background:"#FFF8E1",borderRadius:7,fontSize:12,lineHeight:1.7,color:"#555",border:"0.5px solid #F0CC66"}}>{item.orig}</div>
          </div>
        )}
        {tab==="ai" ? (
          <div style={{marginBottom:10}}>
            <div style={{fontSize:11,color:"#888",marginBottom:4,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span>AI 제안 <span style={{color:"#3B6D11",fontSize:10}}>{curTech?`· ${curTech}`:""}</span></span>
              <button onClick={handleRegen} disabled={regenLoading} style={{fontSize:10,padding:"2px 8px",borderRadius:4,border:"0.5px solid #185FA5",background:"transparent",color:"#185FA5",cursor:regenLoading?"not-allowed":"pointer",whiteSpace:"nowrap"}}>
                {regenLoading?"생성 중...":"🔄 다시 받기"}
              </button>
            </div>
            <div style={{padding:"8px 10px",background:"#F0FFF4",borderRadius:7,fontSize:12,lineHeight:1.7,color:"#333",border:"0.5px solid #86EFAC",minHeight:40}}>
              {regenLoading?<span style={{color:"#888"}}>새 제안 생성 중...</span>:curRewrite}
            </div>
            <div style={{marginTop:5,fontSize:10,color:"#aaa",lineHeight:1.5}}>
              * AI 추천 문구입니다. 어색한 표현은 반드시 수정 후 사용하세요.
            </div>
          </div>
        ) : (
          <div style={{marginBottom:10}}>
            <div style={{fontSize:11,color:"#888",marginBottom:4}}>직접 수정</div>
            {hasPlaceholder(item.aiRewrite) && (
              <div style={{fontSize:11,color:"#534AB7",background:"#EEEDFE",padding:"5px 8px",borderRadius:5,marginBottom:6}}>
                ✏ "N년", "OO" 부분을 실제 숫자나 내용으로 교체하세요
              </div>
            )}
            <textarea value={edited} onChange={e=>setEdited(e.target.value)} style={{width:"100%",height:72,resize:"vertical",fontSize:12,lineHeight:1.6,fontFamily:"inherit",padding:8,border:"0.5px solid #ddd",borderRadius:7,outline:"none",boxSizing:"border-box"}}/>
          </div>
        )}
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>onAccept(item.id, tab==="ai"?curRewrite:edited, item.orig)} style={{flex:1,padding:"8px",fontSize:12,fontWeight:500,background:"#111",color:"#fff",border:"none",borderRadius:7,cursor:"pointer"}}>✓ 채택</button>
          <button onClick={onClose} style={{flex:1,padding:"8px",fontSize:12,background:"transparent",color:"#888",border:"0.5px solid #ddd",borderRadius:7,cursor:"pointer"}}>✕ 거절</button>
        </div>
      </div>
    </div>
  );
}

  return (
    <div style={{border:"0.5px solid #e5e5e5",borderRadius:12,overflow:"hidden",marginBottom:8}}>
      <div style={{padding:"10px 14px",display:"flex",justifyContent:"space-between",gap:10,borderBottom:"0.5px solid #f0f0f0"}}>
        <div style={{fontSize:13,fontStyle:"italic",flex:1}}>{text}</div>
        <span style={{fontSize:11,padding:"2px 8px",borderRadius:4,flexShrink:0,background:evalVal==="ok"?"#E6F1FB":"#FCEBEB",color:evalVal==="ok"?"#185FA5":"#A32D2D"}}>
          {evalVal==="ok"?"괜찮음":"개선 필요"}
        </span>
      </div>
      {note && <div style={{padding:"6px 14px",fontSize:12,color:"#888"}}>{note}</div>}
      <div style={{padding:"0 14px 10px"}}>
        {alts && alts.length > 0 && (
          <div style={{display:"flex",flexDirection:"column",gap:5,marginBottom:8}}>
            {loading ? <div style={{fontSize:12,color:"#888",padding:"6px 0"}}>새 카피 생성 중...</div>
              : alts.map((s,j) => <CopyBtn key={j} text={s}/>)}
          </div>
        )}
        {/* ✅ 카피 분석에도 다시 받기 */}
        <button onClick={handleRegen} disabled={loading}
          style={{fontSize:11,padding:"3px 10px",borderRadius:4,border:"0.5px solid #185FA5",background:"transparent",color:loading?"#aaa":"#185FA5",cursor:loading?"not-allowed":"pointer"}}>
          {loading?"생성 중...":"🔄 다시 받기"}
        </button>
      </div>
    </div>
  );
}

// ✅ 가이드 텍스트 감지 (모듈 레벨)
function isGuidanceText(text) {
  if (!text) return true;
  return /추가하세요|보완하세요|제시하세요|삽입하세요|넣으세요|작성하세요|입력하세요/.test(text);
}

// ✅ 반려 항목 / 수동 추가 필요 항목 직접 작성 패널
function ManualWritePanel({ itemLabel, isCritical, isEvidence, guidance, pdLabel, bgKnowledge, onSave, onClose }) {
  const [text, setText] = useState("");
  const [aiRec, setAiRec] = useState("");
  const [aiLoading, setAiLoading] = useState(false);
  const color = isCritical ? "#A32D2D" : "#854F0B";
  const bg = isCritical ? "#FCEBEB" : "#FFF8E1";
  const border = isCritical ? "#FCA5A5" : "#F0CC66";

  async function getAIRec() {
    if (!guidance) return;
    setAiLoading(true);
    try {
      const bgNote = bgKnowledge ? `\n제품/브랜드 정보:\n${bgKnowledge.substring(0,500)}` : "";
      const r = await callClaude(`목적: ${pdLabel||"판매/전환"}
가이드: ${guidance}${bgNote}

위 가이드를 충족하는 실제 대본 문장 1개 작성.
심리 마케팅 원칙 적용:
- 설명 말고 깨닫게 만들어라
- 인식 전복 우선: "○○라고 생각하는데 아닙니다"
- 감정 트리거 은근하게: 손실회피/후회/불안/인정욕구 중 하나
- 사회적 증거나 구체 수치 있으면 반드시 활용
- 현장감 있는 구어체. AI 티 나는 문장 금지.
- 60자 이내 실제 대본에 바로 삽입 가능한 한 문장.

JSON만 반환: {"aiRewrite":"실제대본문장","psychTech":"기법명"}`, PSYCH_SYSTEM);
      if (r.aiRewrite) setAiRec(r.aiRewrite);
    } catch(e) {} finally { setAiLoading(false); }
  }

  return (
    <div style={{marginTop:8,border:`1.5px solid ${border}`,borderRadius:10,overflow:"hidden"}}>
      <div style={{padding:"8px 12px",background:bg}}>
        <span style={{fontSize:12,fontWeight:500,color}}>
          {isCritical ? "⚠ 반려 기준 항목 — 실제 내용 직접 작성 필수" : "✏ 직접 내용 작성"}
        </span>
      </div>
      <div style={{padding:"10px 12px"}}>
        {/* 구조 가이드 표시 */}
        {guidance && (
          <div style={{marginBottom:10}}>
            <div style={{fontSize:11,color:"#888",marginBottom:4}}>AI 구조 가이드</div>
            <div style={{padding:"8px 10px",background:"#F8F7FF",borderRadius:7,fontSize:12,lineHeight:1.7,color:"#534AB7",border:"0.5px solid #C4C0F0"}}>{guidance}</div>
          </div>
        )}
        {/* 배경지식 없을 때 업로드 안내 */}
        {!bgKnowledge && !guidance && isEvidence && (
          <div style={{fontSize:11,color:"#534AB7",background:"#EEEDFE",padding:"7px 10px",borderRadius:7,marginBottom:8,lineHeight:1.6}}>
            💡 배경지식 파일을 업로드하면 실제 수치·사례 기반 AI 추천을 받을 수 있어요
          </div>
        )}
        {!bgKnowledge && !guidance && !isEvidence && (
          <div style={{fontSize:11,color:"#888",marginBottom:6,lineHeight:1.6}}>
            실제 대본에 추가할 내용을 작성하면 수동 추가 목록에 저장됩니다.
          </div>
        )}
        {bgKnowledge && !guidance && (
          <div style={{fontSize:11,color:"#3B6D11",background:"#EAF3DE",padding:"7px 10px",borderRadius:7,marginBottom:8,lineHeight:1.6}}>
            ✓ 배경지식 파일 기반으로 내용을 작성하거나, "✏ 수정" 버튼으로 AI 추천을 받아보세요
          </div>
        )}

        {/* AI 추천 내용 */}
        {guidance && (
          <div style={{marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
              <span style={{fontSize:11,color:"#888"}}>AI 추천 내용</span>
              <button onClick={getAIRec} disabled={aiLoading}
                style={{fontSize:10,padding:"2px 8px",border:"0.5px solid #534AB7",background:"transparent",color:aiLoading?"#aaa":"#534AB7",borderRadius:4,cursor:aiLoading?"not-allowed":"pointer"}}>
                {aiLoading?"생성 중...":"✦ 추천 받기"}
              </button>
            </div>
            {aiRec && (
              <div style={{padding:"8px 10px",background:"#F0FFF4",borderRadius:7,fontSize:12,lineHeight:1.7,color:"#333",border:"0.5px solid #86EFAC",marginBottom:6,cursor:"pointer"}}
                onClick={()=>setText(aiRec)}>
                {aiRec}
                <div style={{fontSize:10,color:"#3B6D11",marginTop:4}}>↑ 클릭하면 아래에 복사</div>
              </div>
            )}
          </div>
        )}

        <textarea value={text} onChange={e=>setText(e.target.value)}
          placeholder="대본에 추가할 실제 내용을 작성하세요..."
          style={{width:"100%",height:72,resize:"vertical",fontSize:12,fontFamily:"inherit",padding:8,border:"0.5px solid #ddd",borderRadius:7,outline:"none",boxSizing:"border-box"}}/>
        <div style={{display:"flex",gap:8,marginTop:8}}>
          <button onClick={()=>{if(text.trim()){onSave(itemLabel,text.trim());onClose();}}} disabled={!text.trim()}
            style={{flex:1,padding:"8px",fontSize:12,fontWeight:500,background:text.trim()?color:"#ccc",color:"#fff",border:"none",borderRadius:7,cursor:text.trim()?"pointer":"not-allowed"}}>
            수동 추가 목록에 저장
          </button>
          <button onClick={onClose}
            style={{flex:1,padding:"8px",fontSize:12,background:"transparent",color:"#888",border:"0.5px solid #ddd",borderRadius:7,cursor:"pointer"}}>취소</button>
        </div>
      </div>
    </div>
  );
}

function CatSection({ cat, allItems, pdLabel, bgKnowledge, accepted, acceptedTxts, excluded, onAccept, onExclude, onUpdateRewrite, onAddManual }) {
  const [open,setOpen]=useState(cat.fail);
  const [openRW,setOpenRW]=useState({});
  const [openEx,setOpenEx]=useState({});
  const [openManual,setOpenManual]=useState({});
  // 카테고리 통과율 기반 색상 힌트
  const [passN, total] = cat.score.split("/").map(Number);
  const allPass = passN === total;
  return (
    <div className="cat-card">
      <div className="cat-head" onClick={()=>setOpen(o=>!o)}>
        <div className="cat-head-left">
          {/* 통과율 dot */}
          <div style={{width:7,height:7,borderRadius:"50%",background:allPass?"#16A34A":passN>0?"#F59E0B":"#E5E7EB",flexShrink:0}}/>
          <span className="cat-name">{cat.name}</span>
          <span className="cat-score">{cat.score}</span>
        </div>
        <span style={{fontSize:12,color:"#999",transform:open?"rotate(180deg)":"none",transition:"transform .2s",display:"inline-block"}}>▾</span>
      </div>
      {open && (
        <div className="cat-body">
          {cat.items.map((item,idx) => {
            const isCrit=item.critical&&!item.pass, isAcc=accepted[item.id], isExc=excluded[item.id];
            const rwOpen=openRW[item.id], exOpen=openEx[item.id], manualOpen=openManual[item.id];
            const hasRW = !item.pass && item.aiRewrite != null && item.aiRewrite !== "";
            const canEdit = !item.pass && !isAcc && !isExc;
            const isStructure = STRUCTURE_ITEM_IDS.includes(item.id);
            const isEvidence = EVIDENCE_ITEM_IDS.includes(item.id);
            const isDual = DUAL_MODE_ITEM_IDS.includes(item.id);
            const evidenceCanAI = isEvidence && !!bgKnowledge;
            // 수동 작성: 구조항목 / 증거(bg없을때) / 반려항목(dual 아닌)
            const needsManual = canEdit && (
              isStructure ||
              (isEvidence && !bgKnowledge) ||
              (isCrit && !isDual)
            );
            // ✅ Q2 수정: 구조항목 제외하고 미흡 항목은 항상 ✏ 수정 버튼 표시
            // orig 없거나 가이드텍스트여도 다시받기로 AI 제안 받을 수 있음
            const showAI = canEdit && !isStructure && (
              !isEvidence || evidenceCanAI
            );
            return (
              <div key={item.id} className="ci-row" id={`item-${item.id}`}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,color:isAcc?"#3B6D11":isExc?"#854F0B":isCrit?"#A32D2D":"#111",fontWeight:isAcc||isCrit||isExc?500:400}}>
                      {isAcc?"✓ ":isExc?"— ":""}{allItems[item.id]}
                    </div>
                    <div style={{fontSize:12,color:"#888",marginTop:2}}>
                      {isAcc?`변경됨: "${acceptedTxts[item.id]}"`:isExc?`제외: ${isExc}`:item.reason}
                    </div>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:5,flexShrink:0}}>
                    {canEdit && (
                      <>
                        {/* 직접 작성: 구조 / 수동 필요 / 반려이면서 AI 없을 때 / 증거+bg 병행 */}
                        {(needsManual || (isCrit && !showAI) || (evidenceCanAI) || isDual) && (
                          <button onClick={()=>setOpenManual(p=>({...p,[item.id]:!p[item.id]}))}
                            className={`btn-manual${manualOpen?" active":""}`}>
                            {manualOpen?"닫기":"✏ 직접 작성"}
                          </button>
                        )}
                        {/* AI 수정: 의미있는 제안 있을 때 OR 항목13 OR 증거+bg */}
                        {showAI && (
                          <button onClick={()=>setOpenRW(p=>({...p,[item.id]:!p[item.id]}))}
                            className={`btn-edit${rwOpen?" active":""}`}>
                            {rwOpen?"닫기":"✏ 수정"}
                          </button>
                        )}
                        <button onClick={()=>setOpenEx(p=>({...p,[item.id]:!p[item.id]}))}
                          className={`btn-excl${exOpen?" active":""}`}>
                          {exOpen?"닫기":"제외"}
                        </button>
                      </>
                    )}
                    <span className={isAcc?"s-acc":isExc?"s-exc":isCrit?"s-crit":item.pass?"s-pass":"s-fail"}>
                      {isAcc?"채택 후 변경":isExc?"— 제외":item.pass?"✓ 통과":isCrit?"✕ 반려":"✕ 미흡"}
                    </span>
                  </div>
                </div>
                {item.pass&&item.suggestion && <div className="suggestion-box"><span>✦</span><span>{item.suggestion}</span></div>}
                {/* ManualWritePanel - 반려/수동 추가 필요/증거/구조 항목 */}
                {manualOpen&&canEdit && (
                  <ManualWritePanel
                    itemLabel={allItems[item.id]}
                    isCritical={isCrit && !isDual}
                    isEvidence={isEvidence}
                    guidance={isStructure||isGuidanceText(item.aiRewrite) ? item.aiRewrite : null}
                    pdLabel={pdLabel}
                    bgKnowledge={bgKnowledge}
                    onSave={(label,text)=>{
                      // 직접 작성도 채택과 동일하게 처리 (orig 있으면 교체, 없으면 편집창)
                      onAccept(item.id, text, item.orig);
                      setOpenManual(p=>({...p,[item.id]:false}));
                    }}
                    onClose={()=>setOpenManual(p=>({...p,[item.id]:false}))}/>
                )}
                {/* RewritePanel - 구조항목 제외한 모든 미흡 항목에 표시 */}
                {rwOpen&&canEdit&&showAI && (
                  <RewritePanel item={item} pdLabel={pdLabel} catName={cat.name} bgKnowledge={bgKnowledge}
                    defaultTab="ai"
                    onAccept={(id,text,orig)=>{onAccept(id,text,orig);setOpenRW(p=>({...p,[id]:false}));}}
                    onClose={()=>setOpenRW(p=>({...p,[item.id]:false}))}
                    onUpdateRewrite={onUpdateRewrite}/>
                )}
                {exOpen&&!isAcc&&!isExc && <ExcludePanel itemId={item.id} onExclude={(id,reason)=>{onExclude(id,reason);setOpenEx(p=>({...p,[id]:false}));}} onClose={()=>setOpenEx(p=>({...p,[item.id]:false}))}/>}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ✅ 대본 직접 수정 편집창 - 수동 추가 내용 붙여넣거나 직접 수정 + 되돌리기
function ScriptEditor({ script, setScript, onSave, onScrollToLast, appendText, clearAppend, forceOpen, clearForceOpen, pendingPasteText, clearPending, pendingLabel, highlightText, clearHighlight, highlightLine }) {
  const [open, setOpen] = useState(false);
  const [editText, setEditText] = useState(script);
  const [history, setHistory] = useState([]); // 되돌리기용 이전 대본 스택
  const [saved, setSaved] = useState(false);
  const textareaRef = React.useRef(null);

  // ✅ 외부에서 "대본에 추가" 버튼 누르면 자동 열리고 텍스트 추가
  React.useEffect(() => {
    if (appendText) {
      setEditText(prev => {
        const base = prev || script;
        return base + (base.endsWith('\n') ? '' : '\n\n') + appendText;
      });
      setOpen(true);
      clearAppend();
      setTimeout(() => textareaRef.current?.focus(), 100);
    }
  }, [appendText]);



  const [changedText, setChangedText] = useState("");
  const [changedLine, setChangedLine] = useState(null);

  // ✅ 채택 후 변경된 텍스트 노란 배너로 표시 + 해당 위치로 자동 스크롤
  React.useEffect(() => {
    if (highlightText && script.includes(highlightText)) {
      setEditText(script);
      setOpen(true);
      setChangedText(highlightText);
      setChangedLine(highlightLine || null);
      if (clearHighlight) clearHighlight();
      setTimeout(() => {
        if (textareaRef.current) {
          const idx = script.indexOf(highlightText);
          const linesAbove = script.substring(0, idx).split('\n').length;
          const lineHeight = 22;
          textareaRef.current.scrollTop = Math.max(0, (linesAbove - 4) * lineHeight);
          textareaRef.current.focus();
        }
      }, 200);
    }
  }, [highlightText]);

  // ✅ forceOpen: 채택 실패 시 편집창만 열기 (텍스트 append 없음, 클립보드에서 붙여넣기)
  React.useEffect(() => {
    if (forceOpen) {
      if (!open) setEditText(script);
      setOpen(true);
      clearForceOpen();
      setTimeout(() => textareaRef.current?.focus(), 150);
    }
  }, [forceOpen]);

  // 편집창 열 때 현재 script로 초기화
  function handleOpen() {
    if (!open) setEditText(script);
    setOpen(o => !o);
  }

  function handleSave() {
    if (editText.trim()) {
      setHistory(h => [...h.slice(-4), script]);
      setScript(editText);
      onSave();
      setSaved(true);
      setTimeout(() => {
        setSaved(false);
        setOpen(false);
        onScrollToLast && onScrollToLast();
      }, 800);
    }
  }

  function handleUndo() {
    if (history.length === 0) return;
    const prev = history[history.length - 1];
    setHistory(h => h.slice(0, -1));
    setScript(prev);
    setEditText(prev);
    onSave();
  }

  return (
    <div style={{marginTop:"1rem",border:"2px solid #111",borderRadius:12,overflow:"hidden"}}>
      <div onClick={handleOpen}
        style={{padding:"12px 16px",background:"#111",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:13,fontWeight:600,color:"#fff"}}>✏ 대본 직접 수정</span>
          <span style={{fontSize:11,color:"#aaa"}}>복사한 내용 붙여넣거나 직접 편집 후 재분석</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {history.length > 0 && (
            <button onClick={e=>{e.stopPropagation();handleUndo();}}
              style={{fontSize:11,padding:"3px 10px",background:"#FEF2F2",border:"1px solid #FECACA",color:"#B91C1C",borderRadius:6,cursor:"pointer",whiteSpace:"nowrap"}}>
              ↩ 되돌리기 ({history.length})
            </button>
          )}
          <span style={{fontSize:12,color:"#fff",transform:open?"rotate(180deg)":"none",transition:"transform .2s",display:"inline-block"}}>▾</span>
        </div>
      </div>
      {open && (
        <div style={{padding:"12px 16px"}}>
          {/* ✅ 변경된 텍스트 노란 배너 - 줄 번호 + 위치로 이동 */}
          {changedText && (
            <div style={{marginBottom:10,background:"#FFE566",borderRadius:8,padding:"8px 12px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                <span style={{fontSize:10,color:"#7A6000",fontWeight:600}}>
                  ✏ 방금 변경됨{changedLine ? ` — ${changedLine}번째 줄` : ""}
                </span>
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  <button onClick={()=>{
                    if (textareaRef.current) {
                      const text = editText || script;
                      const idx = text.indexOf(changedText);
                      if (idx !== -1) {
                        textareaRef.current.focus();
                        textareaRef.current.setSelectionRange(idx, idx + changedText.length);
                      }
                    }
                  }} style={{fontSize:10,padding:"2px 8px",background:"#7A6000",color:"#fff",border:"none",borderRadius:4,cursor:"pointer"}}>
                    위치로 이동 ↓
                  </button>
                  <button onClick={()=>{setChangedText("");setChangedLine(null);}}
                    style={{fontSize:14,color:"#7A6000",background:"transparent",border:"none",cursor:"pointer",padding:"0 2px",lineHeight:1}}>✕</button>
                </div>
              </div>
              <div style={{fontSize:12,color:"#333",lineHeight:1.6,wordBreak:"break-all"}}>{changedText}</div>
            </div>
          )}
          {pendingPasteText && (
            <div style={{marginBottom:10,background:"#FFE566",borderRadius:8,padding:"8px 12px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                <span style={{fontSize:10,color:"#7A6000",fontWeight:600}}>
                  📌 {pendingLabel ? `[${pendingLabel}] 대본에 없음` : "새로 추가 필요"} — 복사 후 원하는 위치에 붙여넣기
                </span>
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  <button onClick={()=>{
                    const el=document.createElement('textarea');
                    el.value=pendingPasteText;
                    el.style.cssText='position:fixed;opacity:0;top:0;left:0';
                    document.body.appendChild(el);
                    el.focus();el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);
                    clearPending();
                  }} style={{fontSize:10,padding:"2px 8px",background:"#7A6000",color:"#fff",border:"none",borderRadius:4,cursor:"pointer",fontWeight:500}}>
                    복사
                  </button>
                  <button onClick={clearPending}
                    style={{fontSize:14,color:"#7A6000",background:"transparent",border:"none",cursor:"pointer",padding:"0 2px",lineHeight:1}}>✕</button>
                </div>
              </div>
              <div style={{fontSize:12,color:"#333",lineHeight:1.6,wordBreak:"break-all"}}>{pendingPasteText}</div>
            </div>
          )}
          <div style={{fontSize:11,color:"#6B7280",marginBottom:8,lineHeight:1.6,background:"#F3F4F6",padding:"8px 10px",borderRadius:7}}>
            💡 복사 후 아래 편집창에서 원하는 위치 클릭 → 붙여넣기<br/>

// ✅ Diff 뷰어 - 변경된 부분 시각화 + 전체 원본 비교
function DiffView({ original, updated, changes, manualItems }) {
  const [showDiff, setShowDiff] = useState(false);
  const [copied, setCopied] = useState(false);

  function copy() {
    try { navigator.clipboard.writeText(updated); } catch(e) {}
    setCopied(true); setTimeout(() => setCopied(false), 1500);
  }

  function renderHighlighted(text) {
    if (!changes || changes.length === 0) return text;
    let remaining = text;
    const segments = [];
    changes.filter(c => !c.deleted).forEach(({newText}) => {
      const idx = remaining.indexOf(newText);
      if (idx !== -1) {
        if (idx > 0) segments.push({ type:"normal", text: remaining.substring(0, idx) });
        segments.push({ type:"changed", text: newText });
        remaining = remaining.substring(idx + newText.length);
      }
    });
    if (remaining) segments.push({ type:"normal", text: remaining });
    return segments.map((seg, i) =>
      seg.type === "changed"
        ? <mark key={i} style={{background:"#FFD54F",borderRadius:3,padding:"1px 3px",fontWeight:500,color:"#4E342E",outline:"1.5px solid #FFA000"}}>{seg.text}</mark>
        : <span key={i}>{seg.text}</span>
    );
  }

  function renderOrigHighlighted(text) {
    if (!changes || changes.length === 0) return text;
    let remaining = text;
    const segments = [];
    changes.forEach(({orig, deleted}) => {
      const idx = remaining.indexOf(orig);
      if (idx !== -1) {
        if (idx > 0) segments.push({ type:"normal", text: remaining.substring(0, idx) });
        segments.push({ type:"removed", text: orig, deleted });
        remaining = remaining.substring(idx + orig.length);
      }
    });
    if (remaining) segments.push({ type:"normal", text: remaining });
    return segments.map((seg, i) =>
      seg.type === "removed"
        ? <mark key={i} style={{background:"#FFCDD2",borderRadius:3,padding:"1px 2px",textDecoration:"line-through",color:"#888"}}>{seg.text}</mark>
        : <span key={i}>{seg.text}</span>
    );
  }

  const scriptStyle = {fontSize:13,color:"#333",lineHeight:2,background:"#fff",padding:"10px 12px",borderRadius:8,border:"0.5px solid #e5e5e5",whiteSpace:"pre-wrap",flex:1};

  return (
    <div style={{border:"1.5px solid #3B6D11",borderRadius:12,padding:"14px 16px",marginBottom:"1rem",background:"#f9fff9"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div>
          <div style={{fontSize:14,fontWeight:600,color:"#3B6D11"}}>📝 최종 완성 대본</div>
          {changes.length > 0 && <div style={{fontSize:11,color:"#888",marginTop:2}}>{changes.filter(c=>!c.deleted).length}개 교체 · {changes.filter(c=>c.deleted).length>0?`${changes.filter(c=>c.deleted).length}개 삭제 · `:""}초록=교체됨</div>}
        </div>
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>setShowDiff(d=>!d)}
            style={{fontSize:11,padding:"4px 10px",background:showDiff?"#111":"transparent",border:"0.5px solid #555",color:showDiff?"#fff":"#555",borderRadius:7,cursor:"pointer"}}>
            {showDiff?"비교 닫기":"원본 비교"}
          </button>
          <button onClick={copy}
            style={{fontSize:12,padding:"5px 12px",background:copied?"#EAF3DE":"#3B6D11",color:copied?"#3B6D11":"#fff",border:`0.5px solid ${copied?"#3B6D11":"transparent"}`,borderRadius:8,cursor:"pointer"}}>
            {copied?"복사됨!":"복사"}
          </button>
        </div>
      </div>

      {/* ✅ 원본 비교 - 전체 나란히 */}
      {showDiff ? (
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <div>
            <div style={{fontSize:11,fontWeight:600,color:"#A32D2D",marginBottom:6,padding:"4px 8px",background:"#FFEBEE",borderRadius:6,display:"inline-block"}}>원본</div>
            <div style={scriptStyle}>{renderOrigHighlighted(original)}</div>
          </div>
          <div>
            <div style={{fontSize:11,fontWeight:600,color:"#3B6D11",marginBottom:6,padding:"4px 8px",background:"#E8F5E9",borderRadius:6,display:"inline-block"}}>수정 후</div>
            <div style={scriptStyle}>{renderHighlighted(updated)}</div>
          </div>
        </div>
      ) : (
        <div style={scriptStyle}>{changes.length > 0 ? renderHighlighted(updated) : updated}</div>
      )}
    </div>
  );
}

// ✅ 배경지식 입력 - 파일 선택 / 드래그드롭 / URL / 직접 텍스트 입력
function BgKnowledgeInput({ bgKnowledge, bgFileName, setBgKnowledge, setBgFileName, fileRef, onFileUpload, setErrMsg }) {
  const [tab, setTab] = useState(bgFileName ? "file" : bgKnowledge ? "text" : "file");
  const [dragging, setDragging] = useState(false);
  const [textInput, setTextInput] = useState(bgFileName ? "" : bgKnowledge || "");
  const [urlInput, setUrlInput] = useState("");
  const [urlLoading, setUrlLoading] = useState(false);
  const [urlPreview, setUrlPreview] = useState("");

  function handleDrop(e) {
    e.preventDefault(); setDragging(false);
    const file = e.dataTransfer.files?.[0];
    if (!file) return;
    const name = file.name.toLowerCase();
    if (name.endsWith(".pdf")) { setErrMsg("PDF는 미지원. .txt 또는 .md 파일을 사용하세요."); return; }
    file.text().then(t => { setBgKnowledge(t.substring(0,8000)); setBgFileName(file.name); setErrMsg(""); }).catch(()=>setErrMsg("파일 읽기 실패"));
  }

  function handleTextSave() {
    if (textInput.trim()) { setBgKnowledge(textInput.trim().substring(0,8000)); setBgFileName(""); }
  }

  async function fetchFromUrl() {
    if (!urlInput.trim()) return;
    setUrlLoading(true); setUrlPreview("");

    // 구글 드라이브 영상 링크는 접근 차단
    if (urlInput.includes('drive.google.com')) {
      setUrlPreview("오류: 구글 드라이브 파일은 직접 가져오기가 차단돼요.\n영상이라면 '영상 업로드' 탭으로 직접 올려주세요.\n구글 문서라면 공개 링크 공유 설정을 확인해주세요.");
      setUrlLoading(false);
      return;
    }

    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1500,
          tools: [{ type: "web_search_20250305", name: "web_search" }],
          messages: [{ role: "user", content: `다음 URL을 방문해서 마케팅 배경지식으로 활용할 수 있는 핵심 정보를 정리해주세요: ${urlInput.trim()}\n\n정리 항목:\n- 회사/브랜드명\n- 주요 제품/서비스 및 특징\n- 구체적 수치 (연혁, 실적, 규모, 인증 등)\n- USP (차별화 포인트)\n- 고객 후기나 사례\n\n500자 이내로 핵심만 정리하세요.` }]
        })
      });
      if (!res.ok) throw new Error(`API 오류 (${res.status})`);
      const data = await res.json();
      if (data.error) throw new Error(data.error.message || "API 오류");
      const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim();
      if (text) setUrlPreview(text);
      else throw new Error("내용을 가져오지 못했어요. 공개 접근 가능한 URL인지 확인해주세요.");
    } catch(e) { setUrlPreview("오류: " + (e.message || "알 수 없는 오류")); }
    finally { setUrlLoading(false); }
  }

  return (
    <div style={{marginBottom:14,background:"#F8F7FF",borderRadius:10,border:"0.5px solid #C4C0F0",overflow:"hidden"}}>
      {/* 헤더 */}
      <div style={{padding:"10px 14px 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontSize:13,fontWeight:500,color:"#534AB7"}}>📎 배경지식</span>
          <span style={{fontSize:10,padding:"2px 7px",borderRadius:10,background:"#EEEDFE",color:"#534AB7"}}>이 기기에 자동 저장</span>
        </div>
        {(bgKnowledge) && (
          <button onClick={()=>{setBgKnowledge("");setBgFileName("");setTextInput("");}} style={{fontSize:11,color:"#A32D2D",background:"transparent",border:"none",cursor:"pointer"}}>✕ 초기화</button>
        )}
      </div>
      {/* 탭 */}
      <div style={{display:"flex",gap:0,padding:"8px 14px 0"}}>
        {[{k:"file",label:"파일"},{k:"url",label:"🌐 URL"},{k:"text",label:"직접 입력"}].map(({k,label},i)=>(
          <button key={k} onClick={()=>setTab(k)}
            style={{fontSize:11,padding:"5px 12px",background:tab===k?"#534AB7":"transparent",color:tab===k?"#fff":"#888",border:`0.5px solid ${tab===k?"#534AB7":"#C4C0F0"}`,borderLeft:i>0?"none":"0.5px solid "+( tab===k?"#534AB7":"#C4C0F0"),borderRadius:i===0?"6px 0 0 6px":i===2?"0 6px 6px 0":"0",cursor:"pointer"}}>
            {label}
          </button>
        ))}
      </div>
      <div style={{padding:"10px 14px 12px"}}>
        {/* 파일 업로드 탭 */}
        {tab === "file" && (
          <div>
            {bgFileName ? (
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:8}}>
                <span style={{fontSize:12,color:"#534AB7",background:"#EEEDFE",padding:"4px 10px",borderRadius:6}}>📄 {bgFileName} <span style={{fontSize:10,color:"#888"}}>· 저장됨</span></span>
                <button onClick={()=>fileRef.current?.click()} style={{fontSize:11,color:"#534AB7",background:"transparent",border:"0.5px solid #C4C0F0",borderRadius:6,padding:"3px 8px",cursor:"pointer"}}>교체</button>
              </div>
            ) : (
              /* 드래그앤드롭 영역 */
              <div
                onDragOver={e=>{e.preventDefault();setDragging(true);}}
                onDragLeave={()=>setDragging(false)}
                onDrop={handleDrop}
                style={{border:`1.5px dashed ${dragging?"#534AB7":"#C4C0F0"}`,borderRadius:8,padding:"18px 14px",textAlign:"center",background:dragging?"#EEEDFE":"#fff",cursor:"pointer",marginBottom:8,transition:"all .15s"}}

                <div style={{fontSize:12,color:dragging?"#534AB7":"#888",marginBottom:2}}>파일을 여기에 끌어다 놓거나</div>
                <div style={{fontSize:11,color:"#534AB7",fontWeight:500}}>클릭해서 파일 선택</div>
                <div style={{fontSize:10,color:"#bbb",marginTop:4}}>.txt .md 지원</div>

          </div>
        )}
        {/* URL 탭 */}
        {tab === "url" && (
          <div>
            <div style={{fontSize:11,color:"#888",marginBottom:8}}>웹사이트 주소를 입력하면 AI가 내용을 읽어와요</div>

  async function extractFromVideo(file) {
    const MAX = 20 * 1024 * 1024;
    if (file.size > MAX) {
      setErrMsg(`파일이 너무 커요 (${(file.size/1024/1024).toFixed(1)}MB). 20MB 이하만 가능해요. 짧게 편집하거나 압축 후 시도해주세요.`);
      return;
    }
    setVideoLoading(true); setErrMsg("");
    try {
      const base64 = await new Promise((res,rej)=>{
        const r = new FileReader();
        r.onload = e => res(e.target.result.split(',')[1]);
        r.onerror = rej;
        r.readAsDataURL(file);
      });
      const mimeType = file.type || 'video/mp4';
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          model:"claude-sonnet-4-6", max_tokens:2000,
          messages:[{ role:"user", content:[
            { type:"video", source:{ type:"base64", media_type:mimeType, data:base64 }},
            { type:"text", text:`이 영상에서 말하는 모든 대사와 나레이션을 정확하게 추출해주세요.
말한 순서 그대로, 있는 그대로 텍스트로 변환해주세요. 자막이 있으면 자막 기준으로.
JSON만 반환: {"script":"추출된대본전체"}`}
          ]}]
        })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      const txt = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
      const m = txt.match(/\{[\s\S]*\}/);
      const extracted = m ? JSON.parse(m[0]).script : txt;
      setScript(extracted || "");
      setInputMode("script");

      setErrMsg("영상 분석 오류: "+e.message+". 파일 형식이나 크기를 확인해주세요.");

  async function reanalyze(){
    setReanalyzing(true);

      let updated = script;
      const changes = [];
      const manualItems = []; // orig 없는 가이드 텍스트 → 수동 추가용
      const replacedOrigs = new Set();

      // 가이드 텍스트 감지: "추가하세요", "보완하세요", "제시하세요" 등 지시형
      function isGuidance(text) {
        return !text || /추가하세요|보완하세요|제시하세요|삽입하세요|넣으세요|작성하세요/.test(text);
      }

      result.parsedItems
        .filter(i => accepted[i.id] && !STRUCTURE_ITEM_IDS.includes(i.id))
        .forEach(item => {
          const txt = acceptedTxts[item.id] || item.aiRewrite;
          const origTrim = item.orig?.trim();
          const label = getAllItems()[item.id] || "";

          // orig 없거나 가이드 텍스트 → 이미 대본에 있으면 skip, 없으면 수동 추가 목록
          if (!origTrim || origTrim.startsWith("(") || isGuidance(txt)) {
            if (txt && !updated.includes(txt)) manualItems.push({ label, text: txt });
            return;
          }

          if (updated.includes(origTrim) && !replacedOrigs.has(origTrim)) {
            // txt 빈 문자열이면 삭제(중복 CTA 제거 등)
            const replacement = txt || "";
            updated = updated.replace(origTrim, replacement).replace(/\n{3,}/g, "\n\n");
            replacedOrigs.add(origTrim);
            changes.push({ orig: origTrim, newText: replacement, label, deleted: !replacement });
          }

              <div style={{fontSize:10,color:"#bbb",marginTop:2}}>컨펌 기준 {passThreshold}% 이상</div>
            </div>
            <div style={{background:vB[result.verdict],borderRadius:10,padding:"1rem",textAlign:"center",display:"flex",flexDirection:"column",justifyContent:"center"}}>
              <div style={{fontSize:12,color:vC[result.verdict],marginBottom:5}}>컨펌 결과</div>
              <div style={{fontSize:15,fontWeight:500,color:vC[result.verdict]}}>{result.verdict==="pass"?"✓":result.verdict==="revise"?"△":"✕"} {vL[result.verdict]}</div>
              {result.verdict==="reject"&&pd?.critical&&(
                <div style={{fontSize:11,color:"#A32D2D",marginTop:6,lineHeight:1.5}}>
                  필수 항목 미포함<br/>
                  <span style={{fontWeight:500}}>"{getAllItems()[pd.critical]}"</span><br/>
                  <span style={{color:"#888",fontSize:10}}>(점수와 무관하게 반드시 포함 필요)</span>
                </div>
              )}
            </div>
          </div>
          {/* ✅ 제외 남용 경고 */}
          {excCount > 0 && excCount >= Math.ceil(result.total * 0.4) && (
            <div style={{padding:"10px 14px",background:"#FFF3CD",border:"0.5px solid #F0CC66",borderRadius:10,fontSize:12,color:"#7B5800",marginBottom:"1rem"}}>
              ⚠ 제외 항목이 {excCount}개입니다. 제외는 "이번 영상에서 실제로 불가능한 항목"에만 사용하세요. 점수가 부풀려질 수 있어요.
            </div>
          )}
          {/* ✅ 채택 결과 토스트 */}
          {acceptToast && (
            <div style={{position:"sticky",top:8,zIndex:100,margin:"0 0 1rem",padding:"10px 14px",borderRadius:10,fontSize:13,fontWeight:500,background:acceptToast.startsWith("✓")?"#EAF3DE":"#FFF8E1",color:acceptToast.startsWith("✓")?"#3B6D11":"#854F0B",border:`1px solid ${acceptToast.startsWith("✓")?"#BBF7D0":"#F0CC66"}`,boxShadow:"0 2px 8px rgba(0,0,0,0.1)"}}>
              {acceptToast}
            </div>
          )}
          {updatedScript&&round===2&&(
            <DiffView original={originalScript} updated={updatedScript} changes={diffChanges} manualItems={manualItems}/>
          )}
          {excCount>0&&<div style={{border:"0.5px solid #F0CC66",borderRadius:12,padding:"10px 14px",marginBottom:"1rem",background:"#FFFBEB"}}><div style={{fontSize:13,fontWeight:500,marginBottom:6,color:"#854F0B"}}>— 제외 처리된 항목 ({excCount}개)</div>{Object.entries(excluded).map(([id,reason])=><div key={id} style={{fontSize:12,color:"#888",display:"flex",gap:8,marginBottom:3}}><span style={{color:"#854F0B"}}>—</span><span>{getAllItems()[id]} <span style={{color:"#aaa"}}>({reason})</span></span></div>)}</div>}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:"1.25rem"}}>
            <div style={{border:"0.5px solid #e5e5e5",borderRadius:12,padding:"12px 16px"}}><div style={{fontSize:13,fontWeight:500,marginBottom:8,color:"#A32D2D"}}>⚠ 주요 문제점</div><ul style={{paddingLeft:"1.1rem",fontSize:13,color:"#888",lineHeight:2.1}}>{(result.issues||[]).map((i,k)=><li key={k}>{i}</li>)}</ul></div>
            <div style={{border:"0.5px solid #e5e5e5",borderRadius:12,padding:"12px 16px"}}><div style={{fontSize:13,fontWeight:500,marginBottom:8,color:"#185FA5"}}>💡 전체 개선 방향</div><p style={{fontSize:13,color:"#888",lineHeight:1.8}}>{result.sug}</p></div>
          </div>

          {/* 영상 카피 분석 - 카피 입력했을 때만 표시 */}
          {result.captionEntered && result.captionAnalysis && result.captionAnalysis.length>0&&(
            <div style={{marginBottom:"1rem"}}>
              <div style={{fontSize:13,fontWeight:500,marginBottom:8}}>영상 카피 분석 <span style={{fontSize:11,fontWeight:400,color:"#888"}}>· 심리 기법 대안 · 클릭 복사</span></div>
              {result.captionAnalysis.map((c,i)=><CaptionRow key={i} item={c} type="caption" pdLabel={pd?.label} bgKnowledge={bgKnowledge}/>)}
            </div>
          )}

          <div style={{fontSize:12,color:"#888",marginBottom:10,marginTop:4}}>미흡 항목은 ✏ 수정 또는 제외 처리 후 재분석하세요</div>
          {result.cats.map((cat,i)=>(
            <CatSection key={i} cat={cat} allItems={getAllItems()} pdLabel={pd?.label} bgKnowledge={bgKnowledge}
              accepted={accepted} acceptedTxts={acceptedTxts} excluded={excluded}
              onAccept={(id,text,orig)=>{
                setAccepted(p=>({...p,[id]:true}));
                setAcceptedTxts(p=>({...p,[id]:text}));
                setLastEditedItemId(id);

                const origTrim = orig?.trim();
                let replaced = false;

                if (origTrim && !origTrim.startsWith("(") && script.includes(origTrim)) {
                  setScript(s => s.replace(origTrim, text));
                  replaced = true;
                }

                if (!replaced && origTrim) {
                  const normalized = origTrim.replace(/\s+/g,' ');
                  const scriptNorm = script.replace(/\s+/g,' ');
                  if (scriptNorm.includes(normalized)) {
                    setScript(s => s.replace(normalized, text));
                    replaced = true;
                  }
                }

                if (replaced) {
                  // 변경 위치(줄번호) 계산
                  const idx = script.indexOf(origTrim || "");
                  const lineNum = idx !== -1 ? script.substring(0, idx).split('\n').length : null;
                  setHighlightText(text);
                  setHighlightLine(lineNum);
                  setAcceptToast("✓ 대본에 반영됐어요");
                  setTimeout(()=>setAcceptToast(""), 2000);
                } else {
                  // orig 없음 → 항목 유형에 따라 스마트 삽입
                  const isOpening = [1,2].includes(id); // 후킹/도입 → 앞에
                  const isCTA = id === 18; // CTA → 맨 끝
                  const isUrgency = id === 13; // 긴급성 → CTA 바로 앞
                  
                  let newScript = script;
                  let insertedIdx = -1;

                  if (isOpening) {
                    newScript = text + "\n\n" + script;
                    insertedIdx = 0;
                  } else if (isUrgency) {
                    // CTA가 있으면 CTA 바로 앞, 없으면 끝
                    const ctaItem = result?.parsedItems?.find(i => i.id === 18);
                    const ctaOrig = ctaItem?.orig?.trim();
                    if (ctaOrig && script.includes(ctaOrig)) {
                      newScript = script.replace(ctaOrig, text + "\n\n" + ctaOrig);
                      insertedIdx = script.indexOf(ctaOrig);
                    } else {
                      newScript = script + "\n\n" + text;
                      insertedIdx = script.length;
                    }
                  } else {
                    // 나머지 → 끝에 추가
                    newScript = script + "\n\n" + text;
                    insertedIdx = script.length;
                  }

                  setScript(newScript);
                  const lineNum = insertedIdx !== -1 ? newScript.substring(0, insertedIdx).split('\n').length + 1 : null;
                  setHighlightText(text);
                  setHighlightLine(lineNum);
                  const posLabel = isOpening ? "앞" : isUrgency ? "CTA 앞" : "끝";
                  setAcceptToast(`✓ 대본 ${posLabel}에 추가됐어요`);
                  setTimeout(()=>setAcceptToast(""), 2000);
                }
              }}
              onExclude={(id,reason)=>setExcluded(p=>({...p,[id]:reason}))}
              onUpdateRewrite={handleUpdateRewrite}
              onAddManual={(label,text)=>setManualItems(prev=>[...prev.filter(m=>m.label!==label),{label,text}])}/>
          ))}

          {accCount>0||excCount>0?(
            <button onClick={reanalyze} style={{marginTop:"1rem",width:"100%",padding:13,fontSize:14,fontWeight:500,background:"#111",color:"#fff",border:"none",borderRadius:10,cursor:"pointer"}}>
              {[accCount>0?`수정 ${accCount}개`:null,excCount>0?`제외 ${excCount}개`:null].filter(Boolean).join(" · ")} 반영 후 재분석 →
            </button>
          ):(
            <div style={{marginTop:"1rem",padding:"12px 14px",background:"#f5f5f5",borderRadius:10,fontSize:13,color:"#888",textAlign:"center"}}>미흡 항목의 "✏ 수정" 또는 "제외" 버튼을 눌러보세요</div>
          )}
          {result.score<passThreshold&&result.verdict!=="reject"&&<div style={{marginTop:"0.5rem",padding:"12px 14px",background:"#FAEEDA",borderRadius:10,fontSize:13,color:"#854F0B"}}>💡 미흡 항목 수정 시 {passThreshold}% 컨펌 달성 가능해요</div>}

          {/* ✅ 대본 직접 수정 편집창 */}
          <ScriptEditor script={script} setScript={setScript}
            appendText={appendText} clearAppend={()=>setAppendText("")}
            forceOpen={forceEditorOpen} clearForceOpen={()=>setForceEditorOpen(false)}
            pendingPasteText={pendingPasteText} clearPending={()=>{setPendingPasteText("");setPendingLabel("");}}
            pendingLabel={pendingLabel}
            highlightText={highlightText} clearHighlight={()=>setHighlightText("")}
            highlightLine={highlightLine}
            onSave={()=>{setDiffChanges([]);setUpdatedScript("");}}
            onScrollToLast={()=>{
              if (lastEditedItemId) {
                const el = document.getElementById(`item-${lastEditedItemId}`);
                if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
              }
            }}/>

          {/* ✅ 수동 추가 목록 - 복사해서 대본 직접 수정에 붙여넣기 */}
          {manualItems.length > 0 && (
            <div style={{marginTop:"1rem",border:"1.5px solid #F0CC66",borderRadius:12,overflow:"hidden"}}>
              <div style={{padding:"10px 14px",background:"#FFF8E1",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontSize:13,fontWeight:600,color:"#854F0B"}}>📋 아래 내용을 대본에 꼭 추가하세요</div>
                  <div style={{fontSize:11,color:"#aaa",marginTop:2}}>복사 → 위 "✏ 대본 직접 수정" 편집창에 붙여넣기</div>
                </div>
                <button onClick={()=>setManualItems([])} style={{fontSize:11,color:"#aaa",background:"transparent",border:"none",cursor:"pointer"}}>전체 지우기</button>
              </div>
              <div style={{padding:"10px 14px"}}>
                {manualItems.map((m,i)=>(
                  <ManualItemRow key={`manual-${i}-${m.label}`} item={m}
                    onDelete={()=>setManualItems(prev=>prev.filter((_,j)=>j!==i))}/>
                ))}
              </div>
            </div>
          )}

          {/* ✅ 신규 대본 제안 */}
          <NewScriptSection script={updatedScript||script} pdLabel={pd?.label} bgKnowledge={bgKnowledge} issues={result.issues} sug={result.sug}/>
        </div>
      )}

      {/* 로딩 */}
      {step===1&&loading&&(
        <div>
          <StepBar labels={SLABELS} current={1}/>
          <div style={{textAlign:"center",padding:"3rem 0"}}>
            <div style={{fontSize:24,marginBottom:16}}>⏳</div>
            <div style={{fontSize:14,color:"#888",marginBottom:12}}>{loadTxt}</div>
            <div style={{width:200,height:3,background:"#f0f0f0",borderRadius:2,margin:"0 auto",overflow:"hidden"}}>
              <div style={{height:"100%",background:"#111",borderRadius:2,animation:"prog 2s ease-in-out infinite"}}/>
            </div>
            <style>{`@keyframes prog{0%{width:10%}50%{width:80%}100%{width:95%}}`}</style>
          </div>
        </div>
      )}

      {/* 입력 */}
      {step===1&&!loading&&(
        <div>
          <StepBar labels={SLABELS} current={1}/>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"1.25rem"}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{fontSize:16,fontWeight:500}}>콘텐츠 입력</div>
              <span style={{fontSize:11,padding:"2px 8px",borderRadius:20,background:"#f0f0f0",color:"#555"}}>{pd?.icon} {pd?.label}</span>
            </div>
            <button onClick={fillSample} style={{fontSize:11,padding:"5px 12px",background:"#EAF3DE",border:"0.5px solid #3B6D11",borderRadius:20,cursor:"pointer",color:"#3B6D11",fontWeight:500}}>✦ 샘플 대본으로 테스트</button>
          </div>

          {/* ✅ 배경지식 - 파일/드래그드롭/직접입력 모두 지원 + 자동 저장 */}
          <BgKnowledgeInput
            bgKnowledge={bgKnowledge}
            bgFileName={bgFileName}
            setBgKnowledge={setBgKnowledge}
            setBgFileName={setBgFileName}
            fileRef={fileRef}
            onFileUpload={handleFileUpload}
            setErrMsg={setErrMsg}
          />

                    <div style={{marginBottom:14}}>
            <div style={{fontSize:13,color:"#888",marginBottom:8}}>입력 방식</div>
            <div style={{display:"flex",gap:8}}>
              {[{k:"script",icon:"📝",label:"대본 직접 입력",sub:"✓ AI 분석"}].map(({k,icon,label,sub})=>(
                <button key={k} onClick={()=>setInputMode(k)} style={{flex:1,padding:"10px 8px",fontSize:12,border:`1.5px solid ${inputMode===k?"#111":"#e5e5e5"}`,background:inputMode===k?"#111":"#fff",color:inputMode===k?"#fff":"#555",borderRadius:10,display:"flex",flexDirection:"column",alignItems:"center",gap:4,cursor:"pointer"}}>
                  <span style={{fontSize:18}}>{icon}</span>
                  <span style={{fontWeight:500}}>{label}</span>
                  <span style={{fontSize:10,color:inputMode===k?"rgba(255,255,255,0.7)":"#3B6D11"}}>{sub}</span>
                </button>
              ))}
            </div>
          </div>

          {inputMode==="script" && (
            <div style={{marginBottom:12}}>
              <label style={{fontSize:13,color:"#888",display:"block",marginBottom:5}}>대본을 입력하세요 <span style={{color:"#A32D2D"}}>*</span></label>
              <textarea value={script} onChange={e=>setScript(e.target.value)} placeholder="촬영 전 대본을 붙여넣어 주세요..." style={{width:"100%",height:150,resize:"vertical",fontSize:13,lineHeight:1.6,fontFamily:"inherit",padding:10,border:"0.5px solid #ddd",borderRadius:8,outline:"none",boxSizing:"border-box"}}/>
            </div>
          )}
          {inputMode==="script" && (
            <div style={{marginBottom:16}}>
              <label style={{fontSize:13,color:"#888",display:"block",marginBottom:5}}>영상 내 카피 <span style={{fontSize:12,color:"#aaa"}}>(있을 시)</span></label>
              <textarea value={caption} onChange={e=>setCaption(e.target.value)} placeholder={"영상에 표시되는 자막이나 텍스트\n예) 휘어지는 타일 / 시공 시간 절반"} style={{width:"100%",height:70,resize:"vertical",fontSize:13,lineHeight:1.6,fontFamily:"inherit",padding:10,border:"0.5px solid #ddd",borderRadius:8,outline:"none",boxSizing:"border-box"}}/>
            </div>
          )}
          {inputMode==="script" && (
            <button onClick={runAnalysis} disabled={!script.trim()} style={{width:"100%",padding:12,fontSize:14,background:script.trim()?"#111":"#ccc",color:"#fff",border:"none",borderRadius:8,cursor:script.trim()?"pointer":"not-allowed",marginBottom:8}}>✦ AI 분석 시작</button>
          )}
          <button onClick={()=>setStep(0)} style={{width:"100%",padding:9,fontSize:12,background:"transparent",border:"0.5px solid #ddd",borderRadius:8,cursor:"pointer",color:"#aaa",marginTop:4}}>← 목적 다시 선택</button>
        </div>
      )}

      {/* 목적 선택 */}
      {step===0&&(
        <div>
          <StepBar labels={SLABELS} current={0}/>

          {/* ✅ 대본으로 자동 분류 */}
          <div style={{marginBottom:"1.25rem",padding:"12px 14px",background:"#f5f5f5",borderRadius:12,border:"0.5px solid #e5e5e5"}}>
            <div style={{fontSize:13,fontWeight:500,marginBottom:6}}>✦ 대본으로 자동 분류</div>
            <textarea value={autoScript} onChange={e=>setAutoScript(e.target.value)}
              placeholder="대본을 붙여넣으면 AI가 목적을 자동으로 분류해줘요..."
              style={{width:"100%",height:80,resize:"none",fontSize:13,lineHeight:1.6,fontFamily:"inherit",padding:8,border:"0.5px solid #ddd",borderRadius:8,outline:"none",boxSizing:"border-box",marginBottom:8}}/>
            <button onClick={autoClassify} disabled={!autoScript.trim()||autoLoading}
              style={{width:"100%",padding:"8px",fontSize:13,background:autoScript.trim()&&!autoLoading?"#111":"#ccc",color:"#fff",border:"none",borderRadius:8,cursor:autoScript.trim()&&!autoLoading?"pointer":"not-allowed"}}>
              {autoLoading?"분류 중...":"AI 자동 분류"}
            </button>
            {autoReason&&purpose&&<div style={{marginTop:8,fontSize:12,color:"#3B6D11",background:"#EAF3DE",padding:"6px 10px",borderRadius:6}}>✓ {PURPOSE_ITEMS[purpose]?.label}으로 분류됨 — {autoReason}</div>}
          </div>

          <div style={{fontSize:13,color:"#888",marginBottom:10,textAlign:"center"}}>또는 직접 선택</div>
          <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:"1.25rem"}}>
            {Object.entries(PURPOSE_ITEMS).map(([k,p])=>(
              <div key={k} onClick={()=>{setPurpose(k);setAutoReason("");}} style={{border:`1.5px solid ${purpose===k?"#111":"#e5e5e5"}`,borderRadius:12,padding:"14px 16px",cursor:"pointer",background:purpose===k?"#f5f5f5":"#fff",display:"flex",alignItems:"center",gap:14,transition:"all .15s"}}>
                <div style={{width:42,height:42,borderRadius:10,background:purpose===k?"#111":"#f0f0f0",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>{p.icon}</div>
                <div style={{flex:1}}><div style={{fontSize:14,fontWeight:500,marginBottom:3}}>{p.label}</div><div style={{fontSize:12,color:"#888"}}>{p.desc}</div></div>
                <span style={{fontSize:18,color:"#ccc",flexShrink:0}}>›</span>
              </div>
            ))}
          </div>
          <button onClick={()=>purpose&&setStep(1)} disabled={!purpose} style={{width:"100%",padding:12,fontSize:14,background:purpose?"#111":"#ccc",color:"#fff",border:"none",borderRadius:8,cursor:purpose?"pointer":"not-allowed"}}>다음 →</button>
        </div>
      )}
      </div>}
    </div></>
  );
}


    const domRoot = ReactDOM.createRoot(document.getElementById("root"));
    domRoot.render(React.createElement(App));
  </script>
</body>
</html>
