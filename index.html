<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영상 콘텐츠 AI 검수 | StoneKim</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fafafa;color:#111}
  #root{min-height:100vh}
  textarea,input,button{font-family:inherit}
  @keyframes prog{0%{width:10%}50%{width:80%}100%{width:95%}}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

const CATS_NORMAL = {
  "후킹":{cl:"#993C1D",bg:"#FAECE7",ids:[1,2,3]},
  "핵심 메시지":{cl:"#185FA5",bg:"#E6F1FB",ids:[4,5,6,7,8]},
  "증거":{cl:"#0F6E56",bg:"#E1F5EE",ids:[9,10,11]},
  "구조·길이":{cl:"#534AB7",bg:"#EEEDFE",ids:[12,13]},
  "전달력":{cl:"#5F5E5A",bg:"#F1EFE8",ids:[14,15]},
  "레퍼런스":{cl:"#854F0B",bg:"#FAEEDA",ids:[16]},
  "CTA":{cl:"#185FA5",bg:"#E6F1FB",ids:[17,18,19,20,21,22]}
};
const ITEMS_NORMAL = {
  1:"첫 3초 안에 후킹",2:"고객 문제/궁금증/충격 포인트로 시작",3:"단순 제품 소개로 시작하지 않음",
  4:"고객 실제 문제 + 공감 상황 제시",5:"USP 최소 3개 포함",6:"모든 표현 구체적 수치로",
  7:"경쟁/기존 방식 대비 차별 포인트",8:"왜 지금 사야 하는지 ⚠️",
  9:"실제 사례 또는 고객 후기",10:"전후 비교 포함",11:"수치/테스트로 가치 입증",
  12:"후킹→문제→해결→증거→CTA 구조",13:"영상 길이 60초 이내",
  14:"초등학생도 이해 가능한 문장",15:"전문 용어 없음",16:"레퍼런스 기반 구조",
  17:"명확한 CTA",18:"상담/문의 안내",19:"샘플 요청 안내",
  20:"댓글/DM 유도",21:"브랜드명 노출",22:"제품명 노출"
};
const CATS_MEME = {
  "바이럴 요소":{cl:"#993C1D",bg:"#FAECE7",ids:[1,2,3,4]},
  "브랜드 자연 노출":{cl:"#534AB7",bg:"#EEEDFE",ids:[5,6,7,8]}
};
const ITEMS_MEME = {
  1:"공유하고 싶은 순간이 있는가",2:"의외성 또는 반전 포인트",3:"트렌드/밈 포맷 활용",4:"댓글 유도 요소",
  5:"브랜드가 억지스럽지 않게 노출",6:"콘텐츠 자체가 재미/공감 중심",7:"브랜드명 최소 1회 노출",8:"영상 길이 15~30초 이내"
};

async function callAPI(prompt) {
  const r = await fetch("/api/analyze", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ prompt })
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "분석 실패");
  return data;
}

function StepBar({labels, current}) {
  return (
    <div style={{display:"flex",alignItems:"center",marginBottom:"1.5rem"}}>
      {labels.map((l,i) => (
        <div key={i} style={{display:"flex",alignItems:"center",flex:i<labels.length-1?1:"none"}}>
          <div style={{display:"flex",alignItems:"center",gap:5,fontSize:12,whiteSpace:"nowrap",
            color:i<current?"#3B6D11":i===current?"#111":"#bbb",fontWeight:i===current?500:400}}>
            <div style={{width:20,height:20,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,flexShrink:0,
              border:i<current?"1.5px solid #3B6D11":i===current?"1.5px solid #111":"1.5px solid #ddd",
              background:i<current?"#EAF3DE":i===current?"#111":"transparent",
              color:i<current?"#3B6D11":i===current?"#fff":"#bbb"}}>
              {i<current?"✓":i+1}
            </div>
            <span>{l}</span>
          </div>
          {i<labels.length-1 && <div style={{flex:1,height:1,background:"#eee",margin:"0 6px",minWidth:6}}/>}
        </div>
      ))}
    </div>
  );
}

function CopyBtn({text}) {
  const [done, setDone] = useState(false);
  if (!text) return null;
  return (
    <div onClick={() => { try { navigator.clipboard.writeText(text); } catch(e){} setDone(true); setTimeout(() => setDone(false), 1500); }}
      style={{padding:"7px 12px",background:done?"#EAF3DE":"#f5f5f5",border:`0.5px solid ${done?"#3B6D11":"#e0e0e0"}`,
        borderRadius:8,fontSize:12,lineHeight:1.6,display:"flex",gap:8,cursor:"pointer"}}>
      <span style={{fontSize:11,fontWeight:500,padding:"1px 6px",borderRadius:4,background:"#e0e0e0",color:"#666",flexShrink:0}}>→</span>
      <span style={{color:done?"#3B6D11":"#111"}}>{done?"복사됨!":text}</span>
    </div>
  );
}

function RewritePanel({item, onAccept, onClose}) {
  const [edited, setEdited] = useState(item.aiRewrite || "");
  const [tab, setTab] = useState("ai");
  return (
    <div style={{marginTop:8,border:"0.5px solid #185FA5",borderRadius:10,overflow:"hidden"}}>
      <div style={{padding:"8px 12px",background:"#E6F1FB",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:12,fontWeight:500,color:"#185FA5"}}>수정 제안</span>
        <div style={{display:"flex",gap:4}}>
          {["ai","manual"].map(t => (
            <button key={t} onClick={() => setTab(t)}
              style={{fontSize:11,padding:"3px 9px",borderRadius:5,cursor:"pointer",border:"none",
                background:tab===t?"#185FA5":"transparent",color:tab===t?"#fff":"#185FA5"}}>
              {t==="ai"?"AI 제안":"직접 수정"}
            </button>
          ))}
        </div>
      </div>
      <div style={{padding:"10px 12px"}}>
        {item.orig && !item.orig.startsWith("(") && (
          <div style={{marginBottom:10}}>
            <div style={{fontSize:11,color:"#888",marginBottom:4}}>현재 대본</div>
            <div style={{padding:"8px 10px",background:"#FFF8E1",borderRadius:7,fontSize:12,lineHeight:1.7,color:"#555",border:"0.5px solid #F0CC66"}}>{item.orig}</div>
          </div>
        )}
        {tab === "ai" ? (
          <div style={{marginBottom:10}}>
            <div style={{fontSize:11,color:"#888",marginBottom:4}}>AI 제안</div>
            <div style={{padding:"8px 10px",background:"#F0FFF4",borderRadius:7,fontSize:12,lineHeight:1.7,color:"#333",border:"0.5px solid #86EFAC"}}>{item.aiRewrite}</div>
          </div>
        ) : (
          <div style={{marginBottom:10}}>
            <div style={{fontSize:11,color:"#888",marginBottom:4}}>직접 수정</div>
            <textarea value={edited} onChange={e => setEdited(e.target.value)}
              style={{width:"100%",height:72,resize:"vertical",fontSize:12,lineHeight:1.6,padding:8,border:"0.5px solid #ddd",borderRadius:7,outline:"none"}}/>
          </div>
        )}
        <div style={{display:"flex",gap:8}}>
          <button onClick={() => onAccept(item.id, tab==="ai"?item.aiRewrite:edited)}
            style={{flex:1,padding:"8px",fontSize:12,fontWeight:500,background:"#111",color:"#fff",border:"none",borderRadius:7,cursor:"pointer"}}>✓ 채택</button>
          <button onClick={onClose}
            style={{flex:1,padding:"8px",fontSize:12,background:"transparent",color:"#888",border:"0.5px solid #ddd",borderRadius:7,cursor:"pointer"}}>✕ 거절</button>
        </div>
      </div>
    </div>
  );
}

function CatSection({cat, items, round, accepted, acceptedTxts, onAccept}) {
  const [open, setOpen] = useState(cat.fail);
  const [openRW, setOpenRW] = useState({});
  return (
    <div style={{marginBottom:8,border:"0.5px solid #e5e5e5",borderRadius:12,overflow:"hidden",background:"#fff"}}>
      <div onClick={() => setOpen(o => !o)} style={{padding:"10px 14px",background:cat.bg,display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:13,fontWeight:500,color:cat.cl}}>{cat.name}</span>
          <span style={{fontSize:11,padding:"2px 7px",borderRadius:4,background:"rgba(255,255,255,0.5)",color:cat.cl}}>{cat.score}</span>
        </div>
        <span style={{fontSize:13,color:cat.cl,transform:open?"rotate(180deg)":"none"}}>▾</span>
      </div>
      {open && (
        <div style={{padding:"0 14px"}}>
          {cat.items.map((item, idx) => {
            const isCrit = item.critical && !item.pass;
            const isAcc = accepted[item.id];
            const rwOpen = openRW[item.id];
            const hasRW = !item.pass && item.aiRewrite;
            return (
              <div key={item.id} style={{padding:"10px 0",borderBottom:idx<cat.items.length-1?"0.5px solid #f0f0f0":"none"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,color:isAcc?"#3B6D11":isCrit?"#A32D2D":"#111",fontWeight:isAcc||isCrit?500:400}}>
                      {isAcc?"✓ ":""}{items[item.id]}
                    </div>
                    <div style={{fontSize:12,color:"#888",marginTop:2}}>{isAcc?`반영됨: "${acceptedTxts[item.id]}"`:item.reason}</div>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:5,flexShrink:0}}>
                    {hasRW && !isAcc && round===1 && (
                      <button onClick={() => setOpenRW(p => ({...p, [item.id]: !p[item.id]}))}
                        style={{fontSize:11,padding:"3px 8px",border:`0.5px solid ${rwOpen?"#111":"#ddd"}`,background:rwOpen?"#111":"transparent",color:rwOpen?"#fff":"#555",borderRadius:6,cursor:"pointer"}}>
                        {rwOpen?"닫기":"✏ 수정"}
                      </button>
                    )}
                    <span style={{fontSize:11,padding:"3px 8px",borderRadius:6,
                      background:isAcc?"#EAF3DE":isCrit?"#F7C1C1":item.pass?"#EAF3DE":"#FCEBEB",
                      color:isAcc?"#3B6D11":isCrit?"#791F1F":item.pass?"#3B6D11":"#A32D2D"}}>
                      {isAcc?"✓ 반영":item.pass?"✓ 통과":isCrit?"✕ 반려":"✕ 미흡"}
                    </span>
                  </div>
                </div>
                {rwOpen && hasRW && !isAcc && (
                  <RewritePanel item={item}
                    onAccept={(id, text) => { onAccept(id, text); setOpenRW(p => ({...p, [id]: false})); }}
                    onClose={() => setOpenRW(p => ({...p, [item.id]: false}))}/>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function App() {
  const [step, setStep] = useState(0);
  const [vtype, setVtype] = useState(null);
  const [script, setScript] = useState("");
  const [caption, setCaption] = useState("");
  const [loading, setLoading] = useState(false);
  const [loadTxt, setLoadTxt] = useState("");
  const [errMsg, setErrMsg] = useState("");
  const [result, setResult] = useState(null);
  const [round, setRound] = useState(1);
  const [accepted, setAccepted] = useState({});
  const [acceptedTxts, setAcceptedTxts] = useState({});

  const SLABELS = ["유형 선택", "입력", "결과"];

  function reset() {
    setStep(0); setVtype(null); setScript(""); setCaption("");
    setErrMsg(""); setResult(null); setRound(1); setAccepted({}); setAcceptedTxts({});
  }

  function buildCats(parsedItems, isMeme) {
    const cats = isMeme ? CATS_MEME : CATS_NORMAL;
    return Object.keys(cats).map(nm => {
      const ci = cats[nm];
      const catItems = parsedItems.filter(i => ci.ids.includes(i.id)).map(i => ({...i, critical: i.id===8 && !i.pass}));
      const passN = catItems.filter(i => i.pass).length;
      return {name:nm, cl:ci.cl, bg:ci.bg, score:`${passN}/${catItems.length}`, fail:catItems.some(i => !i.pass), items:catItems};
    });
  }

  async function runAnalysis() {
    if (!script.trim()) { setErrMsg("대본을 입력해주세요."); return; }
    setErrMsg(""); setLoading(true);
    const msgs = ["대본을 읽고 있습니다...", "체크리스트 분석 중...", "카피 평가 중...", "피드백 생성 중..."];
    let mi = 0;
    setLoadTxt(msgs[0]);
    const lt = setInterval(() => { mi = (mi+1)%msgs.length; setLoadTxt(msgs[mi]); }, 1600);

    try {
      const isMeme = vtype === "meme";
      const items = isMeme ? ITEMS_MEME : ITEMS_NORMAL;
      const itemList = Object.entries(items).map(([id, t]) => `${id}. ${t}`).join("\n");
      const prompt = `아래 대본을 체크리스트 기준으로 분석.

대본: ${script}
${caption ? `\n영상 카피: ${caption}` : ""}

체크리스트 (${isMeme?"밈·바이럴":"일반 영상"}):
${itemList}

JSON만 반환:
{"items":[{"id":1,"pass":true,"reason":"이유","suggestion":""},{"id":2,"pass":false,"reason":"이유","aiRewrite":"수정안","orig":"원본"}],"topIssues":["문제1","문제2"],"suggestions":"개선 방향"}`;

      const parsed = await callAPI(prompt);
      const builtCats = buildCats(parsed.items, isMeme);
      const passCount = parsed.items.filter(i => i.pass).length;
      const total = parsed.items.length;
      const pct = Math.round(passCount/total*100);
      const item8 = parsed.items.find(i => i.id === 8);
      const verdict = !isMeme && item8 && !item8.pass ? "reject" : pct>=90 ? "pass" : "revise";
      setResult({score:pct, pass:passCount, total, verdict, issues:parsed.topIssues||[], sug:parsed.suggestions, cats:builtCats, parsedItems:parsed.items});
      setStep(2);
    } catch (e) {
      setErrMsg("분석 오류: " + e.message);
    } finally {
      clearInterval(lt); setLoading(false);
    }
  }

  const vL = {pass:"컨펌 가능", revise:"수정 후 재검토", reject:"무조건 반려"};
  const vC = {pass:"#3B6D11", revise:"#854F0B", reject:"#A32D2D"};
  const vB = {pass:"#EAF3DE", revise:"#FAEEDA", reject:"#FCEBEB"};

  return (
    <div style={{maxWidth:600, margin:"0 auto", padding:"1.5rem 1rem 3rem"}}>
      <div style={{marginBottom:"1.5rem", paddingBottom:"1rem", borderBottom:"0.5px solid #e5e5e5"}}>
        <div style={{fontSize:20, fontWeight:600, marginBottom:4}}>영상 콘텐츠 AI 검수</div>
        <div style={{fontSize:13, color:"#888"}}>대본을 입력하면 AI가 체크리스트 기준으로 자동 분석합니다</div>
      </div>

      {errMsg && (
        <div style={{padding:"10px 14px", background:"#FCEBEB", border:"0.5px solid #FCA5A5", borderRadius:10, fontSize:13, color:"#A32D2D", marginBottom:12}}>
          ⚠ {errMsg}
        </div>
      )}

      {step === 2 && result && (
        <div>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"1rem"}}>
            <div style={{fontSize:16, fontWeight:500}}>분석 결과</div>
            <button onClick={reset} style={{fontSize:12, padding:"6px 12px", background:"transparent", border:"0.5px solid #ddd", borderRadius:8, cursor:"pointer"}}>↺ 처음부터</button>
          </div>
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:"1rem"}}>
            <div style={{background:"#fff", border:"0.5px solid #e5e5e5", borderRadius:10, padding:"1rem", textAlign:"center"}}>
              <div style={{fontSize:12, color:"#888", marginBottom:4}}>체크리스트 점수</div>
              <div style={{fontSize:32, fontWeight:600, color:vC[result.verdict]}}>{result.score}%</div>
              <div style={{fontSize:12, color:"#888"}}>{result.pass} / {result.total} 통과</div>
            </div>
            <div style={{background:vB[result.verdict], borderRadius:10, padding:"1rem", textAlign:"center", display:"flex", flexDirection:"column", justifyContent:"center"}}>
              <div style={{fontSize:12, color:vC[result.verdict], marginBottom:5}}>컨펌 결과</div>
              <div style={{fontSize:15, fontWeight:500, color:vC[result.verdict]}}>{result.verdict==="pass"?"✓":result.verdict==="revise"?"△":"✕"} {vL[result.verdict]}</div>
            </div>
          </div>
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:"1.25rem"}}>
            <div style={{background:"#fff", border:"0.5px solid #e5e5e5", borderRadius:12, padding:"12px 16px"}}>
              <div style={{fontSize:13, fontWeight:500, marginBottom:8, color:"#A32D2D"}}>⚠ 주요 문제점</div>
              <ul style={{paddingLeft:"1.1rem", fontSize:13, color:"#888", lineHeight:2}}>{(result.issues||[]).map((i,k) => <li key={k}>{i}</li>)}</ul>
            </div>
            <div style={{background:"#fff", border:"0.5px solid #e5e5e5", borderRadius:12, padding:"12px 16px"}}>
              <div style={{fontSize:13, fontWeight:500, marginBottom:8, color:"#185FA5"}}>💡 전체 개선 방향</div>
              <p style={{fontSize:13, color:"#888", lineHeight:1.8}}>{result.sug}</p>
            </div>
          </div>
          <div style={{fontSize:13, fontWeight:500, marginBottom:8}}>체크리스트 상세</div>
          {result.cats.map((cat, i) => (
            <CatSection key={i} cat={cat} items={vtype==="meme"?ITEMS_MEME:ITEMS_NORMAL}
              round={round} accepted={accepted} acceptedTxts={acceptedTxts}
              onAccept={(id, text) => { setAccepted(p => ({...p, [id]: true})); setAcceptedTxts(p => ({...p, [id]: text})); }}/>
          ))}
        </div>
      )}

      {step === 1 && loading && (
        <div>
          <StepBar labels={SLABELS} current={1}/>
          <div style={{textAlign:"center", padding:"3rem 0"}}>
            <div style={{fontSize:24, marginBottom:16}}>⏳</div>
            <div style={{fontSize:14, color:"#888", marginBottom:12}}>{loadTxt}</div>
            <div style={{width:200, height:3, background:"#f0f0f0", borderRadius:2, margin:"0 auto", overflow:"hidden"}}>
              <div style={{height:"100%", background:"#111", borderRadius:2, animation:"prog 2s ease-in-out infinite"}}/>
            </div>
          </div>
        </div>
      )}

      {step === 1 && !loading && (
        <div>
          <StepBar labels={SLABELS} current={1}/>
          <div style={{display:"flex", alignItems:"center", gap:8, marginBottom:"1.25rem"}}>
            <div style={{fontSize:16, fontWeight:500}}>콘텐츠 입력</div>
            <span style={{fontSize:11, padding:"2px 8px", borderRadius:20, background:vtype==="normal"?"#E6F1FB":"#FAECE7", color:vtype==="normal"?"#185FA5":"#993C1D"}}>
              {vtype==="normal"?"일반 영상":"밈 · 바이럴"}
            </span>
          </div>
          <div style={{marginBottom:12}}>
            <label style={{fontSize:13, color:"#888", display:"block", marginBottom:5}}>
              대본을 입력하세요 <span style={{color:"#A32D2D"}}>*</span>
            </label>
            <textarea value={script} onChange={e => setScript(e.target.value)}
              placeholder="촬영 전 대본을 붙여넣어 주세요..."
              style={{width:"100%", height:150, resize:"vertical", fontSize:13, lineHeight:1.6, padding:10, border:"0.5px solid #ddd", borderRadius:8, outline:"none"}}/>
          </div>
          <div style={{marginBottom:16}}>
            <label style={{fontSize:13, color:"#888", display:"block", marginBottom:5}}>
              영상 내 카피 <span style={{fontSize:12, color:"#aaa"}}>(있을 시)</span>
            </label>
            <textarea value={caption} onChange={e => setCaption(e.target.value)}
              placeholder="영상에 표시되는 자막이나 텍스트"
              style={{width:"100%", height:80, resize:"vertical", fontSize:13, lineHeight:1.6, padding:10, border:"0.5px solid #ddd", borderRadius:8, outline:"none"}}/>
          </div>
          <button onClick={runAnalysis} disabled={!script.trim()}
            style={{width:"100%", padding:12, fontSize:14, background:script.trim()?"#111":"#ccc", color:"#fff", border:"none", borderRadius:8, cursor:script.trim()?"pointer":"not-allowed", marginBottom:8}}>
            ✦ AI 분석 시작
          </button>
          <button onClick={() => setStep(0)} style={{width:"100%", padding:9, fontSize:12, background:"transparent", border:"0.5px solid #ddd", borderRadius:8, cursor:"pointer", color:"#aaa"}}>← 유형 다시 선택</button>
        </div>
      )}

      {step === 0 && (
        <div>
          <StepBar labels={SLABELS} current={0}/>
          <div style={{fontSize:16, fontWeight:500, marginBottom:4}}>이 영상은 어떤 유형인가요?</div>
          <div style={{fontSize:13, color:"#888", marginBottom:"1.25rem"}}>유형에 따라 체크리스트 기준이 달라집니다</div>
          <div style={{display:"flex", gap:12, marginBottom:"1.25rem"}}>
            {[
              {k:"normal", icon:"🛒", title:"일반 영상", desc:"제품·브랜드·정보\n판매·인지 목적", meta:"체크리스트 22개"},
              {k:"meme", icon:"😂", title:"밈 · 바이럴", desc:"공유·화제성 중심\n브랜드 자연 노출", meta:"체크리스트 8개"}
            ].map(({k, icon, title, desc, meta}) => (
              <div key={k} onClick={() => setVtype(k)}
                style={{flex:1, border:`1.5px solid ${vtype===k?"#111":"#e5e5e5"}`, borderRadius:12, padding:16, cursor:"pointer", background:vtype===k?"#f5f5f5":"#fff"}}>
                <div style={{width:38, height:38, borderRadius:8, background:vtype===k?"#111":"#f0f0f0", display:"flex", alignItems:"center", justifyContent:"center", marginBottom:10, fontSize:18}}>{icon}</div>
                <div style={{fontSize:14, fontWeight:500, marginBottom:5}}>{title}</div>
                <div style={{fontSize:12, color:"#888", lineHeight:1.7, whiteSpace:"pre-line", marginBottom:8}}>{desc}</div>
                <div style={{fontSize:11, color:"#aaa"}}>{meta}</div>
              </div>
            ))}
          </div>
          <button onClick={() => vtype && setStep(1)} disabled={!vtype}
            style={{width:"100%", padding:12, fontSize:14, background:vtype?"#111":"#ccc", color:"#fff", border:"none", borderRadius:8, cursor:vtype?"pointer":"not-allowed"}}>
            다음 →
          </button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
